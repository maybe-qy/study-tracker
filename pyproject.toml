[project]
name = "study-tracker"
version = "5.1.0"
description = "把模考成绩换算成高考等效分 — 开源、离线、AI 助手驱动的学业追踪工具（适配浙江新高考选考赋分制）"
requires-python = ">=3.9"
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    "openpyxl>=3.1.0,<4.0",
    "jinja2>=3.1.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
