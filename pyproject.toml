[project]
name = "study-tracker"
version = "4.1.0"
description = "面向高中学生的学业追踪与等效分计算工具（浙江新高考）"
requires-python = ">=3.9"
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    "openpyxl>=3.1.0,<4.0",
    "jinja2>=3.1.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
